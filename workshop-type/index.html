<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Workshop Type</title>
        <link rel="stylesheet" href="style.css" type="text/css">
    </head>
    <body>
        <div id="controls">
            <!-- Font Size Control -->
             <label>
                Font Size
                <input id="fontSize" type="range" min="4" max="100"/>
             </label>

            <label>
                Font Weight
                <input id="fontWeight" type="range" min="100" max="1000" />
             </label>

            <label>
                Font Width
                <input id="fontWidth" type="range" min="25" max="151" />
             </label>

        </div>

        <div id="container">
            Hello World
        </div>

        <script src="script.js"></script>
    </body>
</html>
